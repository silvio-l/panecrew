[package]
name = "desktop"
version = "0.1.0"
description = "Panecrew — a grid of live terminal panes with a focus-following file explorer"
authors = ["Silvio Lindstedt"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Windows only (see build.rs): tauri-build's own resource embedding links the
# app manifest only into `[[bin]]` targets (embed-resource's `compile()` emits
# `cargo:rustc-link-arg-bins=`), never into the synthetic binary `cargo test`
# builds for `--lib`. Without the manifest's Common Controls v6 dependency,
# that test binary resolves comctl32.dll to the old System32 copy and crashes
# at startup with STATUS_ENTRYPOINT_NOT_FOUND. Same crate/version tauri-build
# already pulls in transitively, so this adds no second copy to compile.
embed-resource = "3"

[dependencies]
# macos-private-api: das Splash-Fenster braucht ein transparentes NSWindow, damit
# seine gerundeten Ecken nicht auf der eckigen nativen Kontur sitzen. Für den
# Mac App Store disqualifizierend — dorthin geht PaneCrew ohnehin nicht (siehe
# interne Vertriebsentscheidung), Notarisierung für den Direktvertrieb ist davon unberührt.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
trash = "5.2.6"
# tool_detect.rs: Tool-Icon-Erkennung über den Prozessbaum statt über
# Terminal-Ausgabe (deterministisches OS-Prozessstatus, kein Output-Parsing) —
# `portable-pty`s eigenes `process_group_leader()` ist `#[cfg(unix)]`-only,
# `sysinfo` ist der einzige hier bereits geprüfte Weg mit echtem
# Windows-Pfad. Nur das "system"-Feature: kein component/disk/network/user.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
notify-debouncer-full = "0.7.0"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# pty_manager.rs::PtyHandle::kill(): killing just the shell's own pid leaves
# a foreground child it started (dev server, CLI agent, ...) reparented and
# still running instead of terminated -- neither portable-pty's own
# Child/ChildKiller API nor sysinfo (walk-then-kill is racy, and would
# still miss a job-controlled child in its own process group) expose real
# killpg/job-object group-kill semantics, so these two are raw OS calls.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# dock.rs: das native Rechtsklick-Dock-Menü hat keine Tauri-/muda-API (gegen
# beide Quellen direkt geprüft). Statt Tauris eigenem `tauri::menu`-Baum baut
# dock.rs ein EIGENSTÄNDIGES `muda::Menu`, dessen rohes NSMenu über
# `applicationDockMenu:` an tao's App-Delegate gehängt wird (dazu objc2
# unten). Beide sind ohnehin transitive Abhängigkeiten (über tao/wry) —
# hier direkt genutzt, in derselben bereits aufgelösten Version, kein
# zweiter Build.
muda = "0.19.3"
objc2 = "0.6.4"

[target.'cfg(windows)'.dependencies]
# resource_guard.rs adds "libloaderapi"/"processthreadsapi"/"minwindef" on top
# of pty_manager.rs's own set: single-process suspend/resume/kill for the
# per-tab resource guard, distinct from pty_manager's WHOLE-job kill above.
# NtSuspendProcess/NtResumeProcess are undocumented ntdll exports (the same
# ones Process Explorer/Task Manager use for "Suspend Process") -- not part of
# winapi's own bindings, resolved dynamically via LoadLibraryA/GetProcAddress
# instead, so no extra winapi feature is needed for them specifically.
winapi = { version = "0.3", features = ["jobapi2", "winnt", "handleapi", "libloaderapi", "processthreadsapi", "minwindef"] }

[dev-dependencies]
# Only reachable from `cargo run --example gen-cli-docs` (examples get
# dev-dependencies, a `[[bin]]` would not): regenerates docs/cli.md from the
# same `Cli` struct that drives `--help`, so the two can't drift apart.
clap-markdown = "0.1"
# Nur für tests/updater_e2e.rs: `test`-Feature schaltet tauri::test frei
# (mock_builder/mock_context), Cargo unifiziert die Features mit der
# regulären `tauri`-Abhängigkeit oben, kein zweiter Build.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Nur für den install()-Zweig in tests/updater_e2e.rs: baut das Fake-.app.tar.gz
# selbst zusammen -- Versionen sind exakt die, die tauri-plugin-updater ohnehin
# transitiv zieht (s. Cargo.lock), kein zweiter Build.
tar = "0.4"
flate2 = "1.1"
# Nur für die Capability-Scope-Tests in src/windows.rs: exakt der Matcher, den
# Tauri selbst auf das `windows`-Array einer Capability anwendet
# (tauri-2.11.5/src/ipc/authority.rs -> `glob::Pattern::matches`). Kommt
# ohnehin transitiv über `tauri` herein, also kein zweiter Build.
glob = "0.3"

