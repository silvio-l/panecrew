name: Question
description: Ask how something works, or whether PaneCrew supports a use case.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: >
        Check the [README FAQ](https://github.com/silvio-l/panecrew/blob/main/apps/extension/README.md#faq)
        first — it covers platform support, licensing, and how PaneCrew relates
        to the earlier desktop app.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
