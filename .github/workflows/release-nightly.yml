name: Release (Nightly)

# docs/decisions.md -> "Auto-Update via GitHub Releases (Stable + Nightly-Kanal)".
# Nightly speist sich aus `dev` über einen einzigen rollierenden Tag
# `nightly-latest`, der bei jedem Nightly-Release per Force-Push neu gesetzt
# wird -- GitHubs `/releases/latest`-Alias schließt Prereleases aus
# (docs.github.com/rest/releases), ein SemVer-Tag pro Version würde also nicht
# auflösbar sein. Weil der Tag beim Auslösen dieses Workflows schon auf den
# NEUEN Commit zeigt, kommt der Vorgänger-Stand fürs Changelog-Gate aus dem
# Push-Event selbst (`github.event.before`), nicht aus `git rev-parse
# nightly-latest` -- der wäre zu diesem Zeitpunkt bereits der neue Stand.
#
# Auslösen (bewusster Akt, kein Auto-Release pro Push, Punkt 2 der Entscheidung):
#   git tag -f nightly-latest && git push -f origin nightly-latest
#
# Changelog-Gate läuft lokal im pre-push-Hook (.githooks/pre-push), nicht hier
# als eigener Job -- ein Tag-Push mit unvollständigem CHANGELOG.md kommt gar
# nicht erst bis GitHub.

on:
  push:
    tags:
      - "nightly-latest"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nur Apple Silicon -- ein Intel-Build würde auf Apple-Chip-Macs nur
          # über Rosetta laufen und macOS zeigt dafür aktiv einen "wird
          # eingestellt"-Hinweis an (verifiziert 2026-08-13, echte
          # Nightly-DMG-Installation). Kein Intel-Mac-Testgerät vorhanden, und
          # der Zielnutzerkreis sind Apple-Chip-Macs.
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Voller Verlauf statt Shallow-Clone (Default: Tiefe 1) -- die
          # Nightly-Pseudoversion weiter unten braucht die ECHTE, monoton
          # wachsende Commit-Zahl; mit einem Shallow-Clone lieferte
          # `git rev-list --count HEAD` immer 1, und die Pseudoversion wäre
          # nie gestiegen -- derselbe Bug, den dieser Schritt eigentlich löst.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-plugin-updater vergleicht beim Check rein per SemVer -- ohne
      # diesen Schritt trüge jeder Nightly-Build für immer dieselbe, aus
      # package.json/tauri.conf.json/Cargo.toml eingecheckte Versionsnummer,
      # und ein zweiter Nightly-Build würde nie als Update erkannt (identische
      # Version = "kein Update", egal wie viel Code sich geändert hat).
      # Patch = Commit-Anzahl steigt mit jedem Push monoton, ist plattform-
      # unabhängig deterministisch und ändert nur diese CI-Checkout-Kopie --
      # die eingecheckte Version bleibt die reale, kommende Stable-Basis.
      - name: Nightly-Pseudoversion setzen (nur in dieser CI-Kopie, nie committet)
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d. -f1,2)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          [[ "$COMMIT_COUNT" =~ ^[0-9]+$ ]] || { echo "git rev-list lieferte keine Zahl: '$COMMIT_COUNT'" >&2; exit 1; }
          NIGHTLY_VERSION="${MAJOR_MINOR}.${COMMIT_COUNT}"
          echo "Nightly-Version: $NIGHTLY_VERSION"
          node -e "
            const fs = require('fs');
            const version = process.argv[1];
            for (const file of ['apps/desktop/package.json', 'apps/desktop/src-tauri/tauri.conf.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
            const cargoPath = 'apps/desktop/src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"' + version + '\"'));
          " "$NIGHTLY_VERSION"

      - name: Import Apple-Signierzertifikat
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      # Notarisierung über den App-Store-Connect-API-Key statt Apple-ID +
      # App-spezifischem Passwort: Letzteres bräuchte einen interaktiven
      # 2FA-Login, den eine CI nicht leisten kann. Der API-Key ist
      # projektübergreifend bereits vorhanden (selbes Team wie das
      # Signierzertifikat) und vollautomatisierbar.
      - name: Notarisierungs-API-Key schreiben
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Eigenes Keypaar, eigener `identifier`, eigenes Overlay (Punkt 1): der
      # Nightly-Signing-Key ist häufiger exponiert als der Stable-Key, ein
      # kompromittierter Nightly-Key darf Stable nicht mitgefährden.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.NIGHTLY_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NIGHTLY_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/desktop
          tagName: nightly-latest
          releaseName: "PaneCrew Nightly"
          # Anders als Stable (release-stable.yml, bewusst als Draft für ein
          # manuelles Vier-Augen-Publish) bleibt Nightly ein Draft NIE lange
          # genug öffentlich sichtbar zu sein -- Draft-Releases liefert GitHub
          # ohne Auth nicht aus, weder der Updater-Endpoint noch ein direkter
          # Download-Link auf der Website kämen an die Assets. Nightly ist
          # bewusst ungegatet (Punkt 2: "kein Release pro Push, nur bei
          # bewusst gesetzten Tags" -- der Tag-Push selbst ist das Gate).
          releaseDraft: false
          prerelease: true
          # --config-Pfad relativ zu `projectPath` und Tauris Merge-Verhalten
          # sind gegen einen echten lokalen Build verifiziert (identifier,
          # Fenstertitel, Updater-Endpoints landen wie erwartet aus dem
          # Nightly-Overlay) -- s. docs/decisions.md, Ticket 30.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.nightly.conf.json
