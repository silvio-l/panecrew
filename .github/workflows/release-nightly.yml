name: Release (Nightly)

# docs/decisions.md -> "Auto-Update via GitHub Releases (Stable + Nightly-Kanal)".
# Nightly speist sich aus `dev` über einen einzigen rollierenden Tag
# `nightly-latest`, der bei jedem Nightly-Release per Force-Push neu gesetzt
# wird -- GitHubs `/releases/latest`-Alias schließt Prereleases aus
# (docs.github.com/rest/releases), ein SemVer-Tag pro Version würde also nicht
# auflösbar sein. Weil der Tag beim Auslösen dieses Workflows schon auf den
# NEUEN Commit zeigt, kommt der Vorgänger-Stand fürs Changelog-Gate aus dem
# Push-Event selbst (`github.event.before`), nicht aus `git rev-parse
# nightly-latest` -- der wäre zu diesem Zeitpunkt bereits der neue Stand.
#
# Auslösen (bewusster Akt, kein Auto-Release pro Push, Punkt 2 der Entscheidung):
#   git tag -f nightly-latest && git push -f origin nightly-latest
#
# Changelog-Gate läuft lokal im pre-push-Hook (.githooks/pre-push), nicht hier
# als eigener Job -- ein Tag-Push mit unvollständigem CHANGELOG.md kommt gar
# nicht erst bis GitHub.

on:
  push:
    tags:
      - "nightly-latest"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple-Signierzertifikat
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      # Notarisierung über den App-Store-Connect-API-Key statt Apple-ID +
      # App-spezifischem Passwort: Letzteres bräuchte einen interaktiven
      # 2FA-Login, den eine CI nicht leisten kann. Der API-Key ist
      # projektübergreifend bereits vorhanden (selbes Team wie das
      # Signierzertifikat) und vollautomatisierbar.
      - name: Notarisierungs-API-Key schreiben
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Eigenes Keypaar, eigener `identifier`, eigenes Overlay (Punkt 1): der
      # Nightly-Signing-Key ist häufiger exponiert als der Stable-Key, ein
      # kompromittierter Nightly-Key darf Stable nicht mitgefährden.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.NIGHTLY_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NIGHTLY_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/desktop
          tagName: nightly-latest
          releaseName: "PaneCrew Nightly"
          # Anders als Stable (release-stable.yml, bewusst als Draft für ein
          # manuelles Vier-Augen-Publish) bleibt Nightly ein Draft NIE lange
          # genug öffentlich sichtbar zu sein -- Draft-Releases liefert GitHub
          # ohne Auth nicht aus, weder der Updater-Endpoint noch ein direkter
          # Download-Link auf der Website kämen an die Assets. Nightly ist
          # bewusst ungegatet (Punkt 2: "kein Release pro Push, nur bei
          # bewusst gesetzten Tags" -- der Tag-Push selbst ist das Gate).
          releaseDraft: false
          prerelease: true
          # --config-Pfad relativ zu `projectPath` und Tauris Merge-Verhalten
          # sind gegen einen echten lokalen Build verifiziert (identifier,
          # Fenstertitel, Updater-Endpoints landen wie erwartet aus dem
          # Nightly-Overlay) -- s. docs/decisions.md, Ticket 30.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.nightly.conf.json
