name: Release (Nightly)

# docs/decisions.md -> "Auto-Update via GitHub Releases (Stable + Nightly-Kanal)".
# Nightly speist sich aus `dev` über einen einzigen rollierenden Tag
# `nightly-latest`, der bei jedem Nightly-Release neu gesetzt wird -- GitHubs
# `/releases/latest`-Alias schließt Prereleases aus
# (docs.github.com/rest/releases), ein SemVer-Tag pro Version würde also nicht
# auflösbar sein. Weil der Tag beim Auslösen dieses Workflows schon auf den
# NEUEN Commit zeigt, kommt der Vorgänger-Stand fürs Changelog-Gate aus dem
# Push-Event selbst (`github.event.before`), nicht aus `git rev-parse
# nightly-latest` -- der wäre zu diesem Zeitpunkt bereits der neue Stand.
#
# Auslösen (bewusster Akt, kein Auto-Release pro Push, Punkt 2 der Entscheidung)
# -- per Delete+Neu-Anlegen, NICHT per Force-Push (2026-08-15 korrigiert: die
# lokale Coding-Agent-Tooling-Konfiguration auf dieser Maschine verbietet
# `git push -f`/`--force*` bewusst ausnahmslos und projektübergreifend, ein
# lokaler Force-Push ist damit dauerhaft kein AFK-taugliches Mittel für diesen
# Trigger -- Delete+Neu-Anlegen erreicht denselben rollierenden Tag ohne je
# `-f`/`--force` zu brauchen, läuft deshalb unbeanstandet durch):
#   git push origin --delete nightly-latest
#   git tag -f nightly-latest
#   git push origin nightly-latest
#
# Changelog-Gate läuft lokal im pre-push-Hook (.githooks/pre-push), nicht hier
# als eigener Job -- ein Tag-Push mit unvollständigem CHANGELOG.md kommt gar
# nicht erst bis GitHub.

on:
  push:
    tags:
      - "nightly-latest"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nur Apple Silicon -- ein Intel-Build würde auf Apple-Chip-Macs nur
          # über Rosetta laufen und macOS zeigt dafür aktiv einen "wird
          # eingestellt"-Hinweis an (verifiziert 2026-08-13, echte
          # Nightly-DMG-Installation). Kein Intel-Mac-Testgerät vorhanden, und
          # der Zielnutzerkreis sind Apple-Chip-Macs.
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    # Backstop against a hung step running to GitHub's 360-minute default job
    # timeout on a paid macOS runner (2026-08-20 incident: `codesign` hung
    # after replacing the executable signature, silent with no further log
    # output). The signing keychain had auto-locked while the release binary
    # compiled, so headless codesign waited for an impossible password prompt.
    # Real end-to-end job time is ~8-10 minutes on both platforms; this leaves
    # generous headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Voller Verlauf statt Shallow-Clone (Default: Tiefe 1) -- die
          # Nightly-Pseudoversion weiter unten braucht die ECHTE, monoton
          # wachsende Commit-Zahl; mit einem Shallow-Clone lieferte
          # `git rev-list --count HEAD` immer 1, und die Pseudoversion wäre
          # nie gestiegen -- derselbe Bug, den dieser Schritt eigentlich löst.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-plugin-updater vergleicht beim Check rein per SemVer -- ohne
      # diesen Schritt trüge jeder Nightly-Build für immer dieselbe, aus
      # package.json/tauri.conf.json/Cargo.toml eingecheckte Versionsnummer,
      # und ein zweiter Nightly-Build würde nie als Update erkannt (identische
      # Version = "kein Update", egal wie viel Code sich geändert hat).
      # Patch = Commit-Anzahl steigt mit jedem Push monoton, ist plattform-
      # unabhängig deterministisch und ändert nur diese CI-Checkout-Kopie --
      # die eingecheckte Version bleibt die reale, kommende Stable-Basis.
      - name: Nightly-Pseudoversion setzen (nur in dieser CI-Kopie, nie committet)
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d. -f1,2)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          [[ "$COMMIT_COUNT" =~ ^[0-9]+$ ]] || { echo "git rev-list lieferte keine Zahl: '$COMMIT_COUNT'" >&2; exit 1; }
          NIGHTLY_VERSION="${MAJOR_MINOR}.${COMMIT_COUNT}"
          echo "Nightly-Version: $NIGHTLY_VERSION"
          node -e "
            const fs = require('fs');
            const version = process.argv[1];
            for (const file of ['apps/desktop/package.json', 'apps/desktop/src-tauri/tauri.conf.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
            const cargoPath = 'apps/desktop/src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"' + version + '\"'));
          " "$NIGHTLY_VERSION"

      - name: Import Apple-Signierzertifikat
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # GitHub's documented CI setup keeps the temporary keychain unlocked
          # for six hours. A fresh release build can take longer than the
          # keychain's default timeout; once locked, headless codesign waits
          # indefinitely for a password prompt that can never be answered.
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          rm /tmp/cert.p12

      # The certificate is deliberately NOT forwarded to either macOS
      # tauri-action step below. This explicit import owns the one signing
      # keychain for the whole job. If APPLE_CERTIFICATE were still present,
      # Tauri 2.11.4 would ignore build.keychain, create another random
      # keychain, import the same certificate again, and pass that second
      # keychain directly to codesign. The 2026-08-20 release hung in exactly
      # that duplicate-keychain path. APPLE_SIGNING_IDENTITY is sufficient:
      # Tauri then signs through the already-unlocked default build.keychain.

      # Notarisierung über den App-Store-Connect-API-Key statt Apple-ID +
      # App-spezifischem Passwort: Letzteres bräuchte einen interaktiven
      # 2FA-Login, den eine CI nicht leisten kann. Der API-Key ist
      # projektübergreifend bereits vorhanden (selbes Team wie das
      # Signierzertifikat) und vollautomatisierbar.
      - name: Notarisierungs-API-Key schreiben
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Build + sign + notarize WITHOUT publishing yet: omitting tagName/
      # releaseId makes tauri-action skip all release/upload steps (verified
      # against its source -- it logs "No releaseId or tagName provided,
      # skipping all uploads..." and just builds). This is the seam the
      # 2026-08-19 nightly-crash incident was missing: a build that passes
      # notarization can still fail to *launch* (hardened-runtime library
      # validation), and that only shows up once the artifact actually runs.
      # The smoke-test step below is the real gate; the second tauri-action
      # call further down is what actually publishes, and only runs if the
      # smoke test passed. macOS only -- see the smoke-test step's comment
      # for why Windows keeps the original single-step build+publish below.
      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform == 'macos-latest'
        # Real baseline ~5-6 minutes (build + sign + notarize); see the job-
        # level timeout comment above for why this needs its own bound too --
        # a step timeout fails fast on exactly this step instead of waiting
        # for the whole-job backstop.
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.NIGHTLY_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NIGHTLY_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/desktop
          # --config-Pfad relativ zu `projectPath` und Tauris Merge-Verhalten
          # sind gegen einen echten lokalen Build verifiziert (identifier,
          # Fenstertitel, Updater-Endpoints landen wie erwartet aus dem
          # Nightly-Overlay) -- s. docs/decisions.md, Ticket 30.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.nightly.conf.json

      # Launch the actual signed/notarized .app and confirm it survives past
      # launch -- this is exactly the check that would have caught the
      # 2026-08-19 incident (dyld aborted the process before any window
      # opened; `cargo test`/notarization both stayed green through that).
      # macOS only: this incident's failure mode (hardened-runtime library
      # validation) is macOS-specific, and there is no verified-safe way to
      # smoke-launch a GUI app headlessly on the windows-latest runner here.
      - name: "Smoke test: launch built app, verify it doesn't crash (macOS)"
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          if [[ -z "$app_path" ]]; then
            echo "::error::No .app bundle found to smoke test" >&2
            exit 1
          fi
          exe_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")
          "$app_path/Contents/MacOS/$exe_name" > /tmp/smoke-test.log 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::Built app crashed within 5s of launch -- see log below:" >&2
            cat /tmp/smoke-test.log >&2
            exit 1
          fi
          echo "App still running after 5s (pid $pid) -- smoke test passed."
          kill "$pid"
          wait "$pid" 2>/dev/null || true

      # Only reached if the smoke test above passed. Re-running `tauri build`
      # here is a near-no-op (Rust compile output and the frontend dist are
      # already cached from the step above, only bundling/signing/
      # notarization redo their work) -- the bundle dir is cleared first so
      # the DMG step doesn't choke on a file that already exists.
      - name: Clear previous bundle output before republishing
        if: matrix.platform == 'macos-latest'
        run: rm -rf apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle

      # Eigenes Keypaar, eigener `identifier`, eigenes Overlay (Punkt 1): der
      # Nightly-Signing-Key ist häufiger exponiert als der Stable-Key, ein
      # kompromittierter Nightly-Key darf Stable nicht mitgefährden.
      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform == 'macos-latest'
        # Near-no-op rebuild (compile output already cached) + sign/notarize/
        # upload -- baseline ~2 minutes, same hang risk as the first
        # tauri-action call above.
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.NIGHTLY_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NIGHTLY_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/desktop
          tagName: nightly-latest
          releaseName: "PaneCrew Nightly"
          # Anders als Stable (release-stable.yml, bewusst als Draft für ein
          # manuelles Vier-Augen-Publish) bleibt Nightly ein Draft NIE lange
          # genug öffentlich sichtbar zu sein -- Draft-Releases liefert GitHub
          # ohne Auth nicht aus, weder der Updater-Endpoint noch ein direkter
          # Download-Link auf der Website kämen an die Assets. Nightly ist
          # bewusst ungegatet (Punkt 2: "kein Release pro Push, nur bei
          # bewusst gesetzten Tags" -- der Tag-Push selbst ist das Gate).
          releaseDraft: false
          prerelease: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.nightly.conf.json

      # Windows: no build/smoke/republish split above (this incident's
      # failure mode -- macOS hardened-runtime library validation -- doesn't
      # apply here, and there's no verified-safe way to smoke-launch a GUI
      # app headlessly on this runner) -- single build+publish step as
      # before.
      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform == 'windows-latest'
        # Build+publish combined, baseline ~7-8 minutes.
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.NIGHTLY_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NIGHTLY_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: nightly-latest
          releaseName: "PaneCrew Nightly"
          releaseDraft: false
          prerelease: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.nightly.conf.json

  # tauri-action verlinkt in latest.json pro Plattform die GitHub-API-Asset-URL
  # (api.github.com/repos/.../releases/assets/<id>) statt des normalen
  # Download-Links (github.com/.../releases/download/...). Die API-URL
  # unterliegt GitHubs anonymem 60-Requests/Stunde-Limit pro IP -- das trifft
  # jeden echten Nutzer, dessen Netz dieses Kontingent schon anderweitig
  # ausgeschöpft hat: `check()` findet das Update trotzdem (liest latest.json
  # selbst über den unlimitierten .../releases/latest/download/-Pfad), aber
  # der Download-Schritt beim Klick auf "Installieren" scheitert dann mit
  # genau diesem Rate-Limit. Empirisch verifiziert 2026-08-14 (curl gegen
  # dieselbe Asset-URL: 403/remaining:0 anonym, 200 mit Auth-Token). Eigener
  # Job statt Schritt im Matrix-Build: macOS- und Windows-Job liefen parallel
  # und tauri-action mergt beide Plattform-Einträge in dieselbe latest.json --
  # ein Patch mitten in der Matrix liefe der Gegenseite ins offene Messer.
  fix-latest-json:
    name: latest.json auf Direkt-Download-URLs umbiegen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Asset-URLs von api.github.com auf browser_download_url umschreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: nightly-latest
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --output latest.json --clobber
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const repo = process.env.REPO;
            const data = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            for (const platform of Object.values(data.platforms)) {
              const match = platform.url.match(/\/releases\/assets\/(\d+)$/);
              if (!match) continue;
              const assetApiUrl =
                "repos/" + repo + "/releases/assets/" + match[1];
              const browserUrl = execSync(
                "gh api " + assetApiUrl + " --jq .browser_download_url",
                { encoding: "utf8" },
              ).trim();
              platform.url = browserUrl;
            }
            fs.writeFileSync("latest.json", JSON.stringify(data, null, 2) + "\n");
          '
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
