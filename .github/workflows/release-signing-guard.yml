name: Release Signing Guard

on:
  push:
    branches: [dev, main]
    paths:
      - ".github/scripts/check-release-signing.mjs"
      - ".github/scripts/check-release-signing.test.mjs"
      - ".github/workflows/release-nightly.yml"
      - ".github/workflows/release-stable.yml"
      - ".github/workflows/release-signing-guard.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/check-release-signing.mjs"
      - ".github/scripts/check-release-signing.test.mjs"
      - ".github/workflows/release-nightly.yml"
      - ".github/workflows/release-stable.yml"
      - ".github/workflows/release-signing-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-signing:
    name: Verify release signing invariants
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test release signing guard
        run: node --test .github/scripts/check-release-signing.test.mjs

      - name: Verify release signing workflows
        run: node .github/scripts/check-release-signing.mjs
