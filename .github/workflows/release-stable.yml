name: Release (Stable)

# docs/decisions.md -> "Auto-Update via GitHub Releases (Stable + Nightly-Kanal)".
# Stable liest sich aus `main` und dem `app-v{X.Y.Z}`-Tag-Schema; GitHub löst
# `/releases/latest/download/latest.json` daraus automatisch auf (Prereleases
# ausgeschlossen), deshalb ist hier kein manueller "latest"-Alias nötig.
# `desktop-ci.yml` bleibt unangetastet -- das ist reines Lint/Typecheck/Test,
# kein Bundling.
#
# Changelog-Gate läuft lokal im pre-push-Hook (.githooks/pre-push), nicht hier
# als eigener Job -- ein Tag-Push mit unvollständigem CHANGELOG.md kommt gar
# nicht erst bis GitHub.

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nur Apple Silicon -- s. release-nightly.yml für die Begründung
          # (Rosetta-Einstellungshinweis, kein Intel-Testgerät, Zielnutzer
          # sind Apple-Chip-Macs).
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    # See release-nightly.yml's identical timeout comment (2026-08-20
    # incident: `codesign --timestamp` hung indefinitely against Apple's
    # timestamp authority) -- same hang risk, same steps, same fix.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Apple-Notarisierung: eigene APPLE_*-Secrets, getrennt von den
      # Update-Signing-Secrets (Punkt 4/6 der Entscheidung) -- ein
      # kompromittierter Notarisierungs-Key darf nie den Update-Signing-Key
      # mitgefährden und umgekehrt.
      - name: Import Apple-Signierzertifikat
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          rm /tmp/cert.p12

      # Keep certificate ownership in the explicit import above. Passing
      # APPLE_CERTIFICATE to Tauri as well would make it create a second,
      # random keychain and import the same identity again — the path that
      # hung during the 2026-08-20 Nightly codesign step. Supplying only the
      # identity makes both builds reuse the unlocked default build.keychain.

      # Build + sign + notarize WITHOUT publishing yet, same reasoning and
      # verified tauri-action behavior as release-nightly.yml (see its
      # comment on this step): a build that passes notarization can still
      # fail to *launch* (2026-08-19 incident, macOS hardened-runtime
      # library validation), which only shows up once the artifact runs.
      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform == 'macos-latest'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.STABLE_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.STABLE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}

      # Same smoke test as release-nightly.yml -- macOS only, see that
      # workflow's comment for why Windows has no equivalent gate here.
      - name: "Smoke test: launch built app, verify it doesn't crash (macOS)"
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          if [[ -z "$app_path" ]]; then
            echo "::error::No .app bundle found to smoke test" >&2
            exit 1
          fi
          exe_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")
          "$app_path/Contents/MacOS/$exe_name" > /tmp/smoke-test.log 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::Built app crashed within 5s of launch -- see log below:" >&2
            cat /tmp/smoke-test.log >&2
            exit 1
          fi
          echo "App still running after 5s (pid $pid) -- smoke test passed."
          kill "$pid"
          wait "$pid" 2>/dev/null || true

      - name: Clear previous bundle output before republishing
        if: matrix.platform == 'macos-latest'
        run: rm -rf apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle

      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform == 'macos-latest'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.STABLE_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.STABLE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "PaneCrew ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Windows: no build/smoke/republish split, see release-nightly.yml.
      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform == 'windows-latest'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.STABLE_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.STABLE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "PaneCrew ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # Dasselbe tauri-action-Verhalten wie in release-nightly.yml (dortiger
  # Kommentar hat die volle Begründung + empirische Verifikation): latest.json
  # verlinkt pro Plattform die api.github.com-Asset-URL statt des normalen
  # github.com/.../releases/download/-Links -- Erstere unterliegt GitHubs
  # anonymem 60-Requests/Stunde-Limit und lässt "Installieren" im Client
  # scheitern, obwohl "Nach Updates suchen" zuvor anstandslos funktioniert.
  # Läuft trotz `releaseDraft: true` unbesorgt gegen den Draft -- der
  # GITHUB_TOKEN dieses Jobs liest/schreibt Draft-Assets genauso wie
  # veröffentlichte, nur ein anonymer Client-Download bräuchte erst das
  # manuelle Publish (unverändertes Vier-Augen-Gate).
  fix-latest-json:
    name: latest.json auf Direkt-Download-URLs umbiegen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Asset-URLs von api.github.com auf browser_download_url umschreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --output latest.json --clobber
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const repo = process.env.REPO;
            const data = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            for (const platform of Object.values(data.platforms)) {
              const match = platform.url.match(/\/releases\/assets\/(\d+)$/);
              if (!match) continue;
              const assetApiUrl =
                "repos/" + repo + "/releases/assets/" + match[1];
              const browserUrl = execSync(
                "gh api " + assetApiUrl + " --jq .browser_download_url",
                { encoding: "utf8" },
              ).trim();
              platform.url = browserUrl;
            }
            fs.writeFileSync("latest.json", JSON.stringify(data, null, 2) + "\n");
          '
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
