name: Release (Stable)

# docs/decisions.md -> "Auto-Update via GitHub Releases (Stable + Nightly-Kanal)".
# Stable liest sich aus `main` und dem `app-v{X.Y.Z}`-Tag-Schema; GitHub löst
# `/releases/latest/download/latest.json` daraus automatisch auf (Prereleases
# ausgeschlossen), deshalb ist hier kein manueller "latest"-Alias nötig.
# `desktop-ci.yml` bleibt unangetastet -- das ist reines Lint/Typecheck/Test,
# kein Bundling.
#
# Changelog-Gate läuft lokal im pre-push-Hook (.githooks/pre-push), nicht hier
# als eigener Job -- ein Tag-Push mit unvollständigem CHANGELOG.md kommt gar
# nicht erst bis GitHub.

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nur Apple Silicon -- s. release-nightly.yml für die Begründung
          # (Rosetta-Einstellungshinweis, kein Intel-Testgerät, Zielnutzer
          # sind Apple-Chip-Macs).
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Apple-Notarisierung: eigene APPLE_*-Secrets, getrennt von den
      # Update-Signing-Secrets (Punkt 4/6 der Entscheidung) -- ein
      # kompromittierter Notarisierungs-Key darf nie den Update-Signing-Key
      # mitgefährden und umgekehrt.
      - name: Import Apple-Signierzertifikat
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.STABLE_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.STABLE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "PaneCrew ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # Dasselbe tauri-action-Verhalten wie in release-nightly.yml (dortiger
  # Kommentar hat die volle Begründung + empirische Verifikation): latest.json
  # verlinkt pro Plattform die api.github.com-Asset-URL statt des normalen
  # github.com/.../releases/download/-Links -- Erstere unterliegt GitHubs
  # anonymem 60-Requests/Stunde-Limit und lässt "Installieren" im Client
  # scheitern, obwohl "Nach Updates suchen" zuvor anstandslos funktioniert.
  # Läuft trotz `releaseDraft: true` unbesorgt gegen den Draft -- der
  # GITHUB_TOKEN dieses Jobs liest/schreibt Draft-Assets genauso wie
  # veröffentlichte, nur ein anonymer Client-Download bräuchte erst das
  # manuelle Publish (unverändertes Vier-Augen-Gate).
  fix-latest-json:
    name: latest.json auf Direkt-Download-URLs umbiegen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Asset-URLs von api.github.com auf browser_download_url umschreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --output latest.json --clobber
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const repo = process.env.REPO;
            const data = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            for (const platform of Object.values(data.platforms)) {
              const match = platform.url.match(/\/releases\/assets\/(\d+)$/);
              if (!match) continue;
              const assetApiUrl =
                "repos/" + repo + "/releases/assets/" + match[1];
              const browserUrl = execSync(
                "gh api " + assetApiUrl + " --jq .browser_download_url",
                { encoding: "utf8" },
              ).trim();
              platform.url = browserUrl;
            }
            fs.writeFileSync("latest.json", JSON.stringify(data, null, 2) + "\n");
          '
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
