name: Desktop CI

on:
  push:
    branches: [dev, main]
    paths: ["apps/desktop/**"]
  pull_request:
    branches: [main]
    paths: ["apps/desktop/**"]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, knip, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @panecrew/desktop typecheck

      - name: Lint
        run: pnpm --filter @panecrew/desktop lint

      - name: Knip (unused files/deps/exports)
        run: pnpm --filter @panecrew/desktop knip

      - name: Test
        run: pnpm --filter @panecrew/desktop test

      - name: Build
        run: pnpm --filter @panecrew/desktop build

  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # tauri's core crate links against webkit2gtk/appindicator on Linux
      # even for a plain `cargo test` compile — not needed on macOS/Windows,
      # which bring their own native webview.
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `tauri::generate_context!()` in lib.rs embeds `frontendDist`
      # (../dist) at RUST compile time, so `cargo test` needs it built first
      # — same reason the app can't compile without a prior `pnpm build`.
      - name: Build frontend (embedded by tauri::generate_context! at compile time)
        run: pnpm --filter @panecrew/desktop build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
