name: Desktop CI

on:
  push:
    branches: [dev, main]
    paths: ["apps/desktop/**"]
  pull_request:
    branches: [main]
    paths: ["apps/desktop/**"]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, knip, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @panecrew/desktop typecheck

      - name: Lint
        run: pnpm --filter @panecrew/desktop lint

      - name: Knip (unused files/deps/exports)
        run: pnpm --filter @panecrew/desktop knip

      - name: Test
        run: pnpm --filter @panecrew/desktop test

      - name: Build
        run: pnpm --filter @panecrew/desktop build

  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 2026-08-19 incident: a flaky Ubuntu apt mirror hung "apt-get update"
    # for 5+ hours with no output, and without an explicit ceiling the job
    # only stops at GitHub's 360-minute default -- bound it to something
    # close to the ~7-minute historical runtime instead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # tauri's core crate links against webkit2gtk/appindicator on Linux
      # even for a plain `cargo test` compile — not needed on macOS/Windows,
      # which bring their own native webview.
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `tauri::generate_context!()` in lib.rs embeds `frontendDist`
      # (../dist) at RUST compile time, so `cargo test` needs it built first
      # — same reason the app can't compile without a prior `pnpm build`.
      - name: Build frontend (embedded by tauri::generate_context! at compile time)
        run: pnpm --filter @panecrew/desktop build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      # Regression guard for the 2026-08-19 nightly-crash incident: git2's
      # vendored-libgit2 feature vendors libgit2 itself, but libgit2-sys and
      # libssh2-sys still pull in openssl-sys for TLS/SSH crypto -- without
      # `vendored-openssl` too, openssl-sys links dynamically against
      # whatever OpenSSL pkg-config finds on the build machine (Homebrew's
      # on macOS), baking an absolute /opt/homebrew path into the binary.
      # Hardened-runtime library validation refuses to load that on any
      # machine (Team ID mismatch), crashing the shipped app at launch --
      # `cargo test` alone can't catch this since the check only bites a
      # signed binary. Catch any future dependency regressing the same way
      # here, before it ever reaches a signed nightly/stable build.
      - name: Verify no dynamically-linked external libraries (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          external_libs=$(otool -L target/debug/desktop | tail -n +2 | grep -v -E '^\s*(/usr/lib/|/System/)' || true)
          if [[ -n "$external_libs" ]]; then
            echo "::error::desktop binary links against external dylib(s) outside /usr/lib and /System -- this will crash under hardened-runtime library validation on end-user machines:"
            echo "$external_libs"
            exit 1
          fi
